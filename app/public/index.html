<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="out/style.css">
    <title>Document</title>
</head>

<body class="h-full">
    <div class="h-full" id="structogram-builder">
        <div class="grid grid-cols-12 h-full">
            <div class="col-span-7 flex flex-col ">
                <div class="flex bg-gray-200 border-b border-b-gray-400 h-10">
                    <div class="flex flex-row" id="toolbar">

                    </div>
                    <div class="flex flex-row border-l border-gray-800" id="options">
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto m-2" id="undo-button">undo</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto m-2" id="redo-button">redo</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto m-2" id="save-button">save</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto m-2" id="load-button">load</button>
                    </div>
                </div>
                <div class="align-middle m-0 bg-white border-b border-b-gray-800" id="specification">
                    <p>In: <span class="t-spec-in"></span></p>
                    <p>Aux: <span class="t-spec-aux"></span></p>
                    <p>Out: <span class="t-spec-out"></span></p>
                </div>
                <div id="build-view" class="basis-full w-full h-full overflow-clip bg-blue-50">
                    <svg width="100%" height="100%">
                        <svg width="8000" height="8000" class="render-target border border-red-600">
                            <svg x="4000" y="4000" class="align-middle m-0 structogram-svg bg-white">
                            </svg>
                        </svg>
                    </svg>
                </div>
                <div class="flex bg-gray-200 border-t border-t-gray-400">
                    <div class="flex-12">
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="switch-to-runner-button">player</button>
                    </div>
                </div>
            </div>
            <div class="col-span-5 bg-gray-800" id="structogram-settings">
            </div>
        </div>
    </div>
    <div class="hidden h-screen overflow-hidden" id="structogram-runner">
        <div class="grid grid-cols-12 h-full">
            <div class="col-span-6 flex flex-col ">
                <div class="bg-white border border-gray-800" id="input-data">
                    
                </div>
                <div class="basis-full w-full h-full overflow-hidden bg-blue-50" id="run-view">
                    <svg width="100%" height="100%">
                        <svg width="8000" height="8000" class="render-target border border-red-600">
                            <svg x="4000" y="4000" class="align-middle m-0 structogram-svg">
                            </svg>
                        </svg>
                    </svg>
                </div>
                <div class="flex bg-gray-200 border-t border-t-gray-400">
                    <div class="flex-12">
                        <div id="speed-label" class="inline">1x</div>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="slower-button">slower</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="faster-button">faster</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="start-button">start</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="pause-button">pause</button>
                        <button class="bg-blue-500 hover:bg-blue-400 text-gray-50 flex-auto" id="switch-to-builder-button">editor</button>
                    </div>
                </div>
            </div>
            <div class="col-span-6 bg-gray-900 flex flex-col h-full" id="program-views">
            </div>
        </div>
        <div id="issues" class="bg-gray-500/40 absolute m-auto w-full h-full left-0 right-0 top-0 hidden">
            <div class="m-auto mt-5 w-1/2 h-2/3 flex flex-col bg-gray-800 border-2 rounded-md border-red-600">
                <p class="text-white text-lg m-2">Issues</p>
                <div class="basis-4/5 overflow-y-scroll bg-gray-700 p-2">
                    <ul class="text-red-400">

                    </ul>
                </div>
                <div class="w-full flex items-center justify-center">
                    <button id="issues-ok" class="m-auto bg-blue-500 hover:bg-blue-400 w-1/5">Ok</button>
                </div>
            </div>
        </div>
        <div id="results" class="bg-gray-500/40 absolute m-auto w-full h-full left-0 right-0 top-0 hidden">
            <div class="m-auto mt-5 w-1/2 h-2/3 flex flex-col bg-gray-800 rounded-md">
                <p class="text-white text-lg m-2">Results</p>
                <div class="basis-4/5 overflow-y-scroll bg-gray-700 p-2">
                    <ul class="text-white">

                    </ul>
                </div>
                <div class="w-full flex items-center justify-center">
                    <button id="results-ok" class="m-auto bg-blue-500 hover:bg-blue-400 w-1/5">Ok</button>
                </div>
            </div>
        </div>
    </div>



    <script src="out/script.js"></script>
</body>

</html>
