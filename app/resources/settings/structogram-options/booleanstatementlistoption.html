<div class="m-2">
    <form class="bg-blue-500 text-gray-100 flex flex-col p-1">
        <div class="flex flex-row">
            <label for="%id%">%name%</label>
            <input id="%id%-add-button" type="button" value="+" class="bg-blue-400 hover:bg-blue-300 w-5 h-5 m-1"></input>
        </div>
        <div class="flex flex-row js-condition-entry">
            <input id="%id%-textfield" type="text" class="h-1/2 w-full bg-gray-600 m-1" placeholder="a=1+2..."></input>
            <input id="%id%-del-button" type="button" value="-" class="bg-blue-400 hover:bg-blue-300 w-5 h-5 m-1"></input>
        </div>
    </form>
</div>
