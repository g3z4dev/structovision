<div class="m-2 bg-blue-500">
    <div class="flex flex-row">
        <p class="text-white"><span class="t-name"></span></p><button class="bg-blue-400 hover:bg-blue-300 w-5 h-5 m-1 t-add-button">+</button>
    </div>
    <div class="t-entries">
        <div class="flex flex-row t-data-entry text-gray-100 m-1">
            <form class="p-1">
                <input type="text" class="t-key-textfield h-1/2 w-full bg-gray-600 m-1 text-white" placeholder="a=1+2..."></input>
            </form>
            <select class="t-type-selector h-1/2 w-full bg-gray-600 m-1" form="%id%-form">
                <option value="number">number</option>
                <option value="string">string</option>
                <option value="boolean">boolean</option>
            </select>
            <button class="t-del-button bg-blue-400 hover:bg-blue-300 w-5 h-5 m-1">-</button>
        </div>
    </div>
</div>
